# Installation, une fois par machine :
#   brew install pre-commit   (ou pip install pre-commit)
#   pre-commit install
#   pre-commit autoupdate     (met gitleaks à sa dernière version)

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: liste-interdite
        name: Liste interdite (noms de clients et d'interviewés)
        entry: scripts/verifier-liste-interdite.sh
        language: script
        pass_filenames: false
        always_run: true
